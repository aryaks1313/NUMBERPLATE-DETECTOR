<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coastal Star | Secure Login</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-brand">
            <div class="brand-mark">CS</div>
            <div>
                <h2>COASTAL STAR</h2>
                <small>Service Intelligence</small>
            </div>
        </div>

        <div class="login-content">

            <p class="eyebrow">SERVICE OPERATIONS PORTAL</p>

            <h1>Welcome back.</h1>

            <p class="login-description">
                Sign in to access your service dashboard
                and vehicle arrival notifications.
            </p>

            <form id="loginForm">

                <label>Username</label>

                <input
                    id="username"
                    type="text"
                    placeholder="Enter your username"
                    required
                >

                <label>Password</label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    required
                >

                <button class="primary-btn login-btn" type="submit">
                    Sign In
                </button>

                <p id="loginError" class="error-message"></p>

            </form>

        </div>

        <div class="login-footer">
            Coastal Star · Secure Service Advisor Portal
        </div>

    </div>

    <script>
        const form = document.getElementById("loginForm");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            const errorBox = document.getElementById("loginError");

            errorBox.textContent = "Signing in...";

            try {

                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Login failed");
                }

                window.location.href = data.redirect;

            } catch(error) {
                errorBox.textContent = error.message;
            }
        });
    </script>

</body>
</html>
